# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: care-approval-iq
metadata:
  template: zynara-care-approval-iq@0.1.0

infra:
  provider: bicep
  path: infra
  module: main

services:
  workflowhost:
    # The MAF Workflow host — the orchestration layer, built on the Microsoft
    # Agent Framework (Microsoft.Agents.AI.Workflows + DurableTask). Replaced the
    # v1 Durable Functions orchestrator (`src/Zynara.Orchestrator`), retired in
    # the MAF migration Phase 5.
    project: src/Zynara.WorkflowHost
    language: dotnet
    host: function
  apiproxy:
    project: src/Zynara.ApiProxy
    language: dotnet
    host: function
  submission:
    # The Submission Adapter — the sole outbound path to a payer. Runs under
    # id-submission: Key Vault Secrets User + Cosmos write, and no Foundry.
    project: src/Zynara.Submission
    language: dotnet
    host: function
  dashboard:
    project: src/Zynara.Dashboard
    language: js
    host: staticwebapp
    dist: .

hooks:
  # After provision (Cosmos + identities exist), before deploy: create the
  # containers and seed the demo reference data. Idempotent.
  postprovision:
    shell: sh
    continueOnError: false
    run: dotnet run --project tools/Zynara.DbDeploy
