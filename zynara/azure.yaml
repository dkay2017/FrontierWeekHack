# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: care-approval-iq
metadata:
  template: zynara-care-approval-iq@0.1.0

infra:
  provider: bicep
  path: infra
  module: main

services:
  orchestrator:
    project: src/Zynara.Orchestrator
    language: dotnet
    host: function
  apiproxy:
    project: src/Zynara.ApiProxy
    language: dotnet
    host: function
  submission:
    # The Submission Adapter — the sole outbound path to a payer (not yet built;
    # the infra provisions its identity + subnet so the boundary is real from day one).
    project: src/Zynara.Submission
    language: dotnet
    host: function
  dashboard:
    project: src/Zynara.Dashboard
    language: js
    host: staticwebapp
    dist: .

hooks:
  postprovision:
    shell: sh
    continueOnError: false
    run: >
      dotnet run --project tools/Zynara.DemoDump -- src/Zynara.Dashboard/demo-cases.json
