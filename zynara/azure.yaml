# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: care-approval-iq
metadata:
  template: zynara-care-approval-iq@0.1.0

infra:
  provider: bicep
  path: infra
  module: main

services:
  orchestrator:
    project: src/Zynara.Orchestrator
    language: dotnet
    host: function
  workflowhost:
    # The MAF Workflow host — v2 of the orchestrator, rebuilt on the Microsoft
    # Agent Framework (Microsoft.Agents.AI.Workflows + DurableTask). Runs
    # alongside `orchestrator` through Phase 4 so the v1 flow stays live while
    # the MAF chain is verified; `orchestrator` is retired in Phase 5.
    project: src/Zynara.WorkflowHost
    language: dotnet
    host: function
  apiproxy:
    project: src/Zynara.ApiProxy
    language: dotnet
    host: function
  submission:
    # The Submission Adapter — the sole outbound path to a payer. Runs under
    # id-submission: Key Vault Secrets User + Cosmos write, and no Foundry.
    project: src/Zynara.Submission
    language: dotnet
    host: function
  dashboard:
    project: src/Zynara.Dashboard
    language: js
    host: staticwebapp
    dist: .

hooks:
  # After provision (Cosmos + identities exist), before deploy: create the
  # containers and seed the demo reference data. Idempotent.
  postprovision:
    shell: sh
    continueOnError: false
    run: dotnet run --project tools/Zynara.DbDeploy
