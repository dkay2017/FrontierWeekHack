<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 832" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <title>Zynara Health · Care Approval IQ — Technical Architecture</title>
  <defs>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0FA3A0"/><stop offset="1" stop-color="#1FBE6B"/>
    </linearGradient>
    <style>
      text{ fill:#0B3B45; }
      .sub{ fill:#3D5B62; }
      .tag{ fill:#0E8F84; }
      .sect{ font-size:12px; font-weight:700; letter-spacing:.11em; }
      .cn{ font-size:11.5px; font-weight:700; }
      .bd{ font-size:9.2px; }
      .sm{ font-size:8.5px; }
      .ico{ fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
      .gl{ fill:none; stroke:#FFFFFF; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <rect width="1300" height="832" fill="#FFFFFF"/>
  <rect width="1300" height="6" fill="url(#seal)"/>

  <!-- ============================ HEADER ============================ -->
  <g transform="translate(40,20)">
    <circle cx="26" cy="26" r="26" fill="url(#seal)"/>
    <circle cx="26" cy="26" r="21" fill="none" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="2.4" stroke-dasharray="1 5"/>
    <path class="gl" stroke-width="4.5" opacity=".45" d="M13 19 H40"/>
    <path class="gl" stroke-width="4.5" opacity=".62" d="M13 26 H35"/>
    <path class="gl" stroke-width="4.5" opacity=".82" d="M13 33 H30"/>
    <path class="gl" stroke-width="5.4" d="M16 32 L24 41 L40 18"/>
  </g>
  <text x="106" y="43" font-size="30" font-weight="800" letter-spacing="-.01em">zynara</text>
  <text x="108" y="57" class="sub" font-size="9" font-weight="600" letter-spacing=".34em">H E A L T H</text>
  <text x="270" y="37" font-size="15" font-weight="600">Care Approval IQ</text>
  <text x="270" y="55" class="tag" font-size="13" font-weight="600" font-style="italic">Proof beats paperwork.</text>
  <text x="1260" y="31" text-anchor="end" class="sub" font-size="10.5" font-weight="700" letter-spacing=".17em">TECHNICAL ARCHITECTURE</text>
  <text x="1260" y="47" text-anchor="end" class="sub" font-size="10">Microsoft Agent-a-thon 2026 · Architect Track</text>
  <text x="1260" y="62" text-anchor="end" class="sub" font-size="10">Deepak Kumar · Original Work</text>
  <line x1="40" y1="76" x2="1260" y2="76" stroke="#0FA3A0" stroke-opacity=".25"/>

  <!-- ======================= THE FIVE AGENTS ======================= -->
  <g transform="translate(40,86)" class="ico" stroke="#7C3AED">
    <path d="M7 0 l1.6 4.4 4.4 1.6 -4.4 1.6 -1.6 4.4 -1.6 -4.4 -4.4 -1.6 4.4 -1.6 z"/>
  </g>
  <text x="62" y="97" class="sect" fill="#7C3AED">THE FIVE SPECIALISED AGENTS</text>
  <text x="366" y="97" class="sub" font-size="10.5">distinct kinds of reasoning — one pipeline</text>

  <!-- agent cards -->
  <g font-size="9">
    <!-- 1 Needs-Auth -->
    <g transform="translate(40,108)">
      <rect width="232" height="120" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-opacity=".28"/>
      <rect x="14" y="14" width="28" height="28" rx="8" fill="#7C3AED"/>
      <g transform="translate(20,20)" class="gl"><circle cx="5" cy="6" r="4"/><path d="M8 9 L15 16 M12.5 16 h2.6 M15.5 16 v-2.6"/></g>
      <text x="14" y="62" class="cn">Needs-Auth</text>
      <text x="14" y="80" class="sub">Auth required? This plan, this</text>
      <text x="14" y="91" class="sub">procedure code, today.</text>
      <line x1="14" y1="100" x2="218" y2="100" stroke="#7C3AED" stroke-opacity=".14"/>
      <text x="14" y="114" class="sm"><tspan fill="#6E8C93">reads  </tspan><tspan fill="#2C4A52">payer rule-set KB</tspan></text>
    </g>
    <!-- 2 Evidence Gap -->
    <g transform="translate(287,108)">
      <rect width="232" height="120" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-opacity=".28"/>
      <rect x="14" y="14" width="28" height="28" rx="8" fill="#7C3AED"/>
      <g transform="translate(20,20)" class="gl"><circle cx="6.5" cy="6.5" r="5"/><path d="M10 10 L16 16"/></g>
      <text x="14" y="62" class="cn">Evidence Gap</text>
      <text x="14" y="80" class="sub">Clinical note vs written criteria</text>
      <text x="14" y="91" class="sub">— met · missing · contradictory</text>
      <line x1="14" y1="100" x2="218" y2="100" stroke="#7C3AED" stroke-opacity=".14"/>
      <text x="14" y="114" class="sm"><tspan fill="#6E8C93">reads  </tspan><tspan fill="#2C4A52">the written criteria</tspan></text>
    </g>
    <!-- 3 Precedent (accent) -->
    <g transform="translate(534,108)">
      <rect width="232" height="120" rx="12" fill="#7C3AED"/>
      <rect x="14" y="14" width="28" height="28" rx="8" fill="#FFFFFF"/>
      <g transform="translate(20,20)" class="ico" stroke="#7C3AED"><path d="M2.5 6 A6 6 0 1 1 3 9.6"/><path d="M2.5 2.5 v3.5 h3.5"/><path d="M8 5 v4 l3 2"/></g>
      <text x="214" y="30" text-anchor="end" font-size="13" fill="#FFFFFF">✦</text>
      <text x="14" y="62" class="cn" fill="#FFFFFF">Precedent</text>
      <text x="14" y="80" font-size="9.2" fill="#EDE6FB">Finds the winning fact-pattern,</text>
      <text x="14" y="91" font-size="9.2" fill="#EDE6FB">then drafts the appeal.</text>
      <line x1="14" y1="100" x2="218" y2="100" stroke="#FFFFFF" stroke-opacity=".3"/>
      <text x="14" y="114" class="sm"><tspan fill="#C9BAEE">reads  </tspan><tspan fill="#FFFFFF">past Submissions + Outcomes</tspan></text>
    </g>
    <!-- 4 Expiry Watch -->
    <g transform="translate(781,108)">
      <rect width="232" height="120" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-opacity=".28"/>
      <rect x="14" y="14" width="28" height="28" rx="8" fill="#7C3AED"/>
      <g transform="translate(21,20)" class="gl"><path d="M2 1 h10 M2 15 h10 M3 1 c0 5 8 5 8 0 M3 15 c0 -5 8 -5 8 0"/></g>
      <text x="14" y="62" class="cn">Expiry Watch</text>
      <text x="14" y="80" class="sub">An approved auth will lapse</text>
      <text x="14" y="91" class="sub">before the procedure date.</text>
      <line x1="14" y1="100" x2="218" y2="100" stroke="#7C3AED" stroke-opacity=".14"/>
      <text x="14" y="114" class="sm"><tspan fill="#6E8C93">reads  </tspan><tspan fill="#2C4A52">auth record + calendar</tspan></text>
    </g>
    <!-- 5 Policy Drift -->
    <g transform="translate(1028,108)">
      <rect width="232" height="120" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-opacity=".28"/>
      <rect x="14" y="14" width="28" height="28" rx="8" fill="#7C3AED"/>
      <g transform="translate(21,20)" class="gl"><path d="M1 2 h8 v12 h-8 z"/><path d="M4 8 h4 M4 11 h4"/><path d="M11 5 v9 h-4"/></g>
      <text x="14" y="62" class="cn">Policy Drift</text>
      <text x="14" y="80" class="sub">A silent criteria change just</text>
      <text x="14" y="91" class="sub">broke this request template.</text>
      <line x1="14" y1="100" x2="218" y2="100" stroke="#7C3AED" stroke-opacity=".14"/>
      <text x="14" y="114" class="sm"><tspan fill="#6E8C93">reads  </tspan><tspan fill="#2C4A52">versioned policy docs</tspan></text>
    </g>
  </g>
  <text x="40" y="248" class="sub" font-size="9">Persistent Azure AI Foundry agents behind <tspan fill="#0B3B45">Zynara.Core</tspan> interfaces — each with a deterministic stub twin, so every test runs offline.</text>

  <!-- ===================== PIPELINE ARCHITECTURE ===================== -->
  <!-- numbers show the request path; layout is grouped by platform, not drawn as a flow -->

  <!-- Panel 1 · INTAKE -->
  <rect x="40" y="262" width="300" height="210" rx="13" fill="#FBE8C8" stroke="#F59E0B" stroke-opacity=".4" stroke-width="1.3"/>
  <circle cx="58" cy="286" r="9" fill="#F59E0B"/><text x="58" y="289.5" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700">1</text>
  <g transform="translate(74,279)" class="ico" stroke="#F59E0B"><path d="M0 9 v4 h14 v-4 M7 0 v8 M4 5 l3 3 3 -3"/></g>
  <text x="98" y="290" class="sect" fill="#C2740B">INTAKE</text>
  <g transform="translate(58,0)">
    <circle cx="0" cy="322.5" r="2.4" fill="#F59E0B"/><text x="13" y="326" class="cn">Clinician request</text><text x="13" y="339" class="sub bd">procedure · plan · note · region</text>
    <circle cx="0" cy="372.5" r="2.4" fill="#F59E0B"/><text x="13" y="376" class="cn">Zynara.Intake</text><text x="13" y="389" class="sub bd">Azure Function · POST /api/requests</text>
    <circle cx="0" cy="422.5" r="2.4" fill="#F59E0B"/><text x="13" y="426" class="cn">Requests Queue</text><text x="13" y="439" class="sub bd">Azure Storage Queue — decouples intake</text>
  </g>

  <!-- Panel 2 · COMPUTE · ORCHESTRATION -->
  <rect x="356" y="262" width="560" height="112" rx="13" fill="#DBE7FD" stroke="#2563EB" stroke-opacity=".4" stroke-width="1.3"/>
  <circle cx="374" cy="286" r="9" fill="#2563EB"/><text x="374" y="289.5" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700">2</text>
  <g transform="translate(390,279)" class="ico" stroke="#2563EB"><rect x="2.5" y="2.5" width="10" height="10" rx="2"/><rect x="5.5" y="5.5" width="4" height="4"/><path d="M2.5 6 H1 M2.5 9 H1 M12.5 6 H14 M12.5 9 H14 M6 2.5 V1 M9 2.5 V1 M6 12.5 V14 M9 12.5 V14"/></g>
  <text x="414" y="290" class="sect" fill="#1D4ED8">COMPUTE · ORCHESTRATION</text>
  <text x="374" y="314" class="bd"><tspan class="cn">Zynara.Orchestrator</tspan><tspan class="sub">  —  Durable Functions · keyed on request id · idempotent</tspan></text>
  <text x="374" y="330" class="sub bd">5 deterministic checks own every value that drives a decision — no LLM in this layer</text>
  <g font-size="8.2" text-anchor="middle" fill="#1D4ED8">
    <rect x="374" y="340" width="98" height="19" rx="9.5" fill="#2563EB" fill-opacity=".1" stroke="#2563EB" stroke-opacity=".3"/><text x="423" y="352.5">NeedsAuthCheck</text>
    <rect x="481" y="340" width="98" height="19" rx="9.5" fill="#2563EB" fill-opacity=".1" stroke="#2563EB" stroke-opacity=".3"/><text x="530" y="352.5">EvidenceGap</text>
    <rect x="588" y="340" width="98" height="19" rx="9.5" fill="#2563EB" fill-opacity=".1" stroke="#2563EB" stroke-opacity=".3"/><text x="637" y="352.5">PrecedentMatch</text>
    <rect x="695" y="340" width="98" height="19" rx="9.5" fill="#2563EB" fill-opacity=".1" stroke="#2563EB" stroke-opacity=".3"/><text x="744" y="352.5">ExpiryMath</text>
    <rect x="802" y="340" width="98" height="19" rx="9.5" fill="#2563EB" fill-opacity=".1" stroke="#2563EB" stroke-opacity=".3"/><text x="851" y="352.5">PolicyDiff</text>
  </g>

  <!-- Panel 3 · AI FOUNDRY · AGENT SERVICE -->
  <rect x="356" y="386" width="560" height="86" rx="13" fill="#E9DDFB" stroke="#7C3AED" stroke-opacity=".4" stroke-width="1.3"/>
  <circle cx="374" cy="410" r="9" fill="#7C3AED"/><text x="374" y="413.5" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700">3</text>
  <g transform="translate(390,403)" class="ico" stroke="#7C3AED"><path d="M7 0 l1.7 4.6 4.6 1.7 -4.6 1.7 -1.7 4.6 -1.7 -4.6 -4.6 -1.7 4.6 -1.7 z"/></g>
  <text x="414" y="414" class="sect" fill="#6D28D9">AI FOUNDRY · AGENT SERVICE</text>
  <g fill="#4A2E7A" font-size="9.2">
    <circle cx="374" cy="432.5" r="2.4" fill="#7C3AED"/><text x="387" y="436">Agents produce prose &amp; judgement only — never a number or a date</text>
    <circle cx="374" cy="448.5" r="2.4" fill="#7C3AED"/><text x="387" y="452">File Search grounded on <tspan font-style="italic">data/policies/&lt;region&gt;/&lt;payer&gt;</tspan></text>
    <circle cx="374" cy="464.5" r="2.4" fill="#7C3AED"/><text x="387" y="468">gpt-4.1 class · one deterministic stub twin per agent for CI</text>
  </g>

  <!-- Panel 4 · DATA -->
  <rect x="932" y="262" width="328" height="210" rx="13" fill="#D3F1E2" stroke="#059669" stroke-opacity=".4" stroke-width="1.3"/>
  <circle cx="950" cy="286" r="9" fill="#059669"/><text x="950" y="289.5" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700">4</text>
  <g transform="translate(966,279)" class="ico" stroke="#059669"><path d="M1.5 3.5 c0 -1.5 2.7 -2.5 6 -2.5 s6 1 6 2.5 v7 c0 1.5 -2.7 2.5 -6 2.5 s-6 -1 -6 -2.5 z"/><path d="M1.5 3.5 c0 1.5 2.7 2.5 6 2.5 s6 -1 6 -2.5"/></g>
  <text x="990" y="290" class="sect" fill="#047857">DATA</text>
  <g transform="translate(950,0)">
    <circle cx="0" cy="316.5" r="2.4" fill="#059669"/><text x="13" y="320" class="cn">Gate</text><text x="13" y="333" class="sub bd">readiness ≥ θ ∧ no gaps → auto-submit</text>
    <circle cx="0" cy="355.5" r="2.4" fill="#059669"/><text x="13" y="359" class="cn">Submission Adapter</text><text x="13" y="372" class="sub bd">the only outbound door</text><text x="13" y="384" class="sub bd">portal · X12 278 · FHIR · fax</text>
    <circle cx="0" cy="406.5" r="2.4" fill="#059669"/><text x="13" y="410" class="cn">Azure SQL <tspan class="sub" font-weight="400">· serverless</tspan></text><text x="13" y="423" class="sub bd">Requests · Outcomes · Precedents ·</text><text x="13" y="435" class="sub bd">Auths · Policies · AgentCalls</text>
    <circle cx="0" cy="455.5" r="2.4" fill="#059669"/><text x="13" y="459" class="cn" fill="#047857">Every action is human-approved</text>
  </g>

  <!-- Panel 5 · EXPERIENCE -->
  <rect x="40" y="488" width="1220" height="94" rx="13" fill="#CFEFF5" stroke="#0891B2" stroke-opacity=".4" stroke-width="1.3"/>
  <circle cx="58" cy="512" r="9" fill="#0891B2"/><text x="58" y="515.5" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700">5</text>
  <g transform="translate(74,505)" class="ico" stroke="#0891B2"><rect x="0.5" y="1.5" width="13" height="9" rx="1.5"/><path d="M5 13 h4 M7 10.5 v2.5"/></g>
  <text x="98" y="516" class="sect" fill="#0E7490">EXPERIENCE</text>
  <text x="58" y="542" class="bd"><tspan class="cn">Reviewer</tspan><tspan class="sub">  —  approves &amp; edits every submit + appeal</tspan></text>
  <text x="470" y="542" class="bd"><tspan class="cn">Dashboard</tspan><tspan class="sub">  —  Queue · Appeals · Early Warnings · Recovery £/$</tspan></text>
  <text x="900" y="542" class="bd"><tspan class="cn">Zynara.ApiProxy</tspan><tspan class="sub">  —  read models + reviewer actions</tspan></text>
  <rect x="58" y="554" width="300" height="22" rx="11" fill="#0891B2"/>
  <text x="208" y="569" text-anchor="middle" fill="#FFFFFF" font-size="9.5" font-weight="700" letter-spacing=".04em">REGION SWITCH   UK  ⇄  US</text>
  <text x="374" y="569" class="sub" font-size="9" font-style="italic">same agents · swap the payer rule-set and the appeal path (FOS ⇄ external review)</text>
  <text x="900" y="569" class="sub" font-size="8.4">Recovery £/$  =  denied × (1 − appeal rate) × win probability × mean claim value</text>

  <!-- ======================= CROSS-CUTTING ======================= -->
  <circle cx="46" cy="606" r="4" fill="#0FA3A0"/>
  <text x="58" y="610" class="sect">CROSS-CUTTING</text>
  <text x="185" y="610" class="sub" font-size="10">spans every layer above</text>

  <g transform="translate(40,618)">
    <rect width="394" height="134" rx="12" fill="#D3F1E2" stroke="#059669" stroke-opacity=".38"/>
    <g transform="translate(18,20)" class="ico" stroke="#059669"><path d="M7 0.8 L12.5 2.6 V7 C12.5 10 10 12.4 7 13.4 C4 12.4 1.5 10 1.5 7 V2.6 Z"/></g>
    <text x="42" y="30" class="sect" fill="#047857">IDENTITY &amp; SECURITY</text>
    <circle cx="20" cy="58" r="2.3" fill="#059669"/><text x="32" y="61" class="cn">Managed identity</text><text x="32" y="73" class="sub bd">SQL · Foundry · Storage — no stored secrets</text>
    <circle cx="20" cy="94" r="2.3" fill="#059669"/><text x="32" y="97" class="cn">Key Vault</text><text x="32" y="109" class="sub bd">App Insights + content-share strings only</text>
  </g>
  <g transform="translate(453,618)">
    <rect width="394" height="134" rx="12" fill="#FBE8C8" stroke="#F59E0B" stroke-opacity=".38"/>
    <g transform="translate(18,20)" class="ico" stroke="#F59E0B"><path d="M0.5 7 H3.5 L5.5 2 L8.5 12 L10.5 7 H13.5"/></g>
    <text x="42" y="30" class="sect" fill="#C2740B">OBSERVABILITY</text>
    <circle cx="20" cy="52" r="2.3" fill="#F59E0B"/><text x="32" y="55" class="cn">App Insights <tspan class="sub" font-weight="400">— one trace id per request id</tspan></text>
    <circle cx="20" cy="80" r="2.3" fill="#F59E0B"/><text x="32" y="83" class="cn">Cost <tspan class="sub" font-weight="400">— every agent call metered → £/$</tspan></text>
    <circle cx="20" cy="108" r="2.3" fill="#F59E0B"/><text x="32" y="111" class="cn">Eval harness <tspan class="sub" font-weight="400">— scored offline, gated in CI</tspan></text>
  </g>
  <g transform="translate(866,618)">
    <rect width="394" height="134" rx="12" fill="#E9DDFB" stroke="#7C3AED" stroke-opacity=".38"/>
    <g transform="translate(18,20)" class="ico" stroke="#7C3AED"><path d="M7 0.8 L12.5 2.6 V7 C12.5 10 10 12.4 7 13.4 C4 12.4 1.5 10 1.5 7 V2.6 Z"/><path d="M4.6 7 l1.8 1.8 3.2 -3.6"/></g>
    <text x="42" y="30" class="sect" fill="#6D28D9">RESPONSIBLE AI</text>
    <circle cx="20" cy="52" r="2.3" fill="#7C3AED"/><text x="32" y="55" class="sub bd">A human approves every outbound action</text>
    <circle cx="20" cy="80" r="2.3" fill="#7C3AED"/><text x="32" y="83" class="sub bd">Agents never set a decision value or date</text>
    <circle cx="20" cy="108" r="2.3" fill="#7C3AED"/><text x="32" y="111" class="sub bd">No PHI in scope — request ids + codes only</text>
  </g>

  <!-- ======================= IMPACT RIBBON ======================= -->
  <rect x="40" y="766" width="1220" height="28" rx="8" fill="url(#seal)"/>
  <text x="650" y="784" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="600" letter-spacing=".01em">THE APPEALS GAP  —  only 11.5% of denials are appealed, yet 80.7% of appeals succeed.   Care Approval IQ is built to close it.</text>

  <!-- ======================= FOOTER ======================= -->
  <line x1="40" y1="810" x2="1260" y2="810" stroke="#0FA3A0" stroke-opacity=".25"/>
  <text x="40" y="826" font-size="9.5" font-weight="700" letter-spacing=".05em">DEEPAK KUMAR · ARCHITECT TRACK SUBMISSION</text>
  <text x="1260" y="826" text-anchor="end" class="sub" font-size="9">Zynara Health (fictional) · Care Approval IQ · Proof beats paperwork.</text>
</svg>
