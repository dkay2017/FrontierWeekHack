<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <style>
    text{ fill:#122A32; }
    .t{ font-size:21px; font-weight:800; }
    .sub{ font-size:12.5px; font-weight:600; fill:#44555C; }
    .chip{ font-size:12.5px; font-weight:700; fill:#1E3A8A; }
    .op{ font-size:26px; font-weight:800; fill:#64748B; }
    .res{ font-size:14px; font-weight:800; fill:#FFFFFF; }
    .mc{ font-size:12.5px; font-weight:800; }
    .mb{ font-size:11px; font-weight:600; fill:#22343B; }
    .foot{ font-size:12px; font-weight:600; fill:#5B6B72; }
  </style>
  <rect width="1120" height="400" fill="#FFFFFF"/>
  <rect width="1120" height="5" fill="#0FA3A0"/>

  <text x="40" y="46" class="t">Business value — a number, not a marketing figure</text>
  <text x="40" y="68" class="sub">Estimated Recoverable Value, computed from the payer's own denial history.</text>

  <!-- formula -->
  <g transform="translate(40,92)">
    <rect x="0" y="0" width="230" height="66" rx="10" fill="#EEF4FF" stroke="#1D4ED8" stroke-opacity=".35"/>
    <text x="115" y="28" text-anchor="middle" class="chip">denials NOT appealed</text>
    <text x="115" y="48" text-anchor="middle" class="mb" fill="#3B4C53">per payer + procedure</text>

    <text x="248" y="42" text-anchor="middle" class="op">×</text>

    <rect x="272" y="0" width="230" height="66" rx="10" fill="#EEF4FF" stroke="#1D4ED8" stroke-opacity=".35"/>
    <text x="387" y="28" text-anchor="middle" class="chip">comparable win-rate</text>
    <text x="387" y="48" text-anchor="middle" class="mb" fill="#3B4C53">from recorded outcomes</text>

    <text x="520" y="42" text-anchor="middle" class="op">×</text>

    <rect x="544" y="0" width="230" height="66" rx="10" fill="#EEF4FF" stroke="#1D4ED8" stroke-opacity=".35"/>
    <text x="659" y="28" text-anchor="middle" class="chip">mean claim value</text>
    <text x="659" y="48" text-anchor="middle" class="mb" fill="#3B4C53">for that scope</text>

    <text x="792" y="42" text-anchor="middle" class="op">=</text>

    <rect x="816" y="-4" width="224" height="74" rx="12" fill="#0E9E6E"/>
    <text x="928" y="30" text-anchor="middle" class="res" font-size="13">ESTIMATED</text>
    <text x="928" y="52" text-anchor="middle" class="res" font-size="16">RECOVERABLE £</text>
  </g>

  <text x="40" y="196" class="mb" font-size="11.5" fill="#5B6B72">Shown per payer/procedure scope and as a portfolio total. Every input on the dashboard. Confidence scales with sample size. No invented "efficiency %".</text>

  <!-- three supporting cards -->
  <g transform="translate(40,214)">
    <g>
      <rect width="336" height="120" rx="12" fill="#F7FAFC" stroke="#0FA3A0" stroke-opacity=".4"/>
      <text x="18" y="30" class="mc" fill="#0C7F76">Faster</text>
      <text x="18" y="54" class="mb">The submission is assembled and</text>
      <text x="18" y="70" class="mb">gap-checked against this plan's criteria</text>
      <text x="18" y="86" class="mb">before a human opens the case.</text>
      <text x="18" y="106" class="mb" font-weight="800">Reviewers triage, they don't assemble.</text>
    </g>
    <g transform="translate(352,0)">
      <rect width="336" height="120" rx="12" fill="#F7FAFC" stroke="#1D4ED8" stroke-opacity=".4"/>
      <text x="18" y="30" class="mc" fill="#1D4ED8">Safer</text>
      <text x="18" y="54" class="mb">A missing mandatory criterion is never</text>
      <text x="18" y="70" class="mb">averaged away. A note that contradicts</text>
      <text x="18" y="86" class="mb">itself is flagged, not resolved.</text>
      <text x="18" y="106" class="mb" font-weight="800">Unsure → the system abstains.</text>
    </g>
    <g transform="translate(704,0)">
      <rect width="336" height="120" rx="12" fill="#F7FAFC" stroke="#7C3AED" stroke-opacity=".4"/>
      <text x="18" y="30" class="mc" fill="#5B21B6">Auditable</text>
      <text x="18" y="54" class="mb">Every decision replays: which criterion,</text>
      <text x="18" y="70" class="mb">which precedent, which clause, what the</text>
      <text x="18" y="86" class="mb">critic challenged, who signed off.</text>
      <text x="18" y="106" class="mb" font-weight="800">A regulator can follow the trail.</text>
    </g>
  </g>
</svg>
