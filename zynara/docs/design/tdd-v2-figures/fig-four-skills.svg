<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 468" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <style>
    text{ fill:#122A32; }
    .t{ font-size:21px; font-weight:800; }
    .sub{ font-size:12.5px; font-weight:600; fill:#44555C; }
    .cn{ font-size:15px; font-weight:800; }
    .ch{ font-size:9.5px; font-weight:800; letter-spacing:.06em; }
    .bd{ font-size:11.5px; font-weight:600; fill:#22343B; }
    .em{ font-size:11.5px; font-weight:800; }
    .foot{ font-size:13px; font-weight:700; fill:#0C7F76; }
    .gl{ fill:none; stroke:#FFFFFF; stroke-width:2.1; stroke-linecap:round; stroke-linejoin:round; }
  </style>
  <rect width="1120" height="468" fill="#FFFFFF"/>
  <rect width="1120" height="5" fill="#0FA3A0"/>

  <text x="40" y="46" class="t">The four core skills — all four, shipped and demonstrated</text>
  <text x="40" y="68" class="sub">Each skill is one course challenge. Care Approval IQ delivers every one, carried into a live system.</text>

  <g transform="translate(40,86)">
    <!-- BUILD -->
    <g>
      <rect width="256" height="292" rx="14" fill="#FBEFDC" stroke="#E08A2B" stroke-opacity=".5"/>
      <rect x="18" y="18" width="42" height="42" rx="10" fill="#E08A2B"/>
      <g transform="translate(30,30)" class="gl"><path d="M0 5 L9 0 L18 5 L9 10 Z M0 5 V13 L9 18 M18 5 V13 L9 18 M9 10 V18"/></g>
      <text x="72" y="34" class="cn" fill="#B4681A">Build</text>
      <text x="72" y="50" class="ch" fill="#B4681A">CHALLENGE 1</text>
      <line x1="18" y1="72" x2="238" y2="72" stroke="#E08A2B" stroke-opacity=".3"/>
      <text x="18" y="98" class="bd">5 Foundry reasoning agents,</text>
      <text x="18" y="116" class="bd">built via the SDK.</text>
      <text x="18" y="146" class="bd">Each behind a typed interface</text>
      <text x="18" y="164" class="bd">with a deterministic stub twin —</text>
      <text x="18" y="182" class="bd">the whole pipeline runs in CI</text>
      <text x="18" y="200" class="bd">with zero live inference.</text>
      <text x="18" y="242" class="em" fill="#B4681A">They build AND challenge —</text>
      <text x="18" y="260" class="em" fill="#B4681A">one agent is a pure critic that</text>
      <text x="18" y="278" class="em" fill="#B4681A">tries to disprove the case.</text>
    </g>
    <!-- MONITOR -->
    <g transform="translate(272,0)">
      <rect width="256" height="292" rx="14" fill="#EDE6FB" stroke="#7C3AED" stroke-opacity=".5"/>
      <rect x="18" y="18" width="42" height="42" rx="10" fill="#7C3AED"/>
      <g transform="translate(31,31)" class="gl"><circle cx="6.5" cy="6.5" r="6"/><path d="M11 11 L18 18"/></g>
      <text x="72" y="34" class="cn" fill="#5B21B6">Monitor</text>
      <text x="72" y="50" class="ch" fill="#5B21B6">CHALLENGE 2</text>
      <line x1="18" y1="72" x2="238" y2="72" stroke="#7C3AED" stroke-opacity=".3"/>
      <text x="18" y="98" class="bd">One trace per request:</text>
      <text x="18" y="116" class="bd">pipeline.run → spoke.* →</text>
      <text x="18" y="134" class="bd">invoke_agent * → chat gpt-5.4.</text>
      <text x="18" y="164" class="bd">Every model call is tagged with</text>
      <text x="18" y="182" class="bd">its agent name + token counts,</text>
      <text x="18" y="200" class="bd">feeding a per-agent £/$ meter.</text>
      <text x="18" y="242" class="em" fill="#5B21B6">Verified live from the deployed</text>
      <text x="18" y="260" class="em" fill="#5B21B6">workflow host — you can see</text>
      <text x="18" y="278" class="em" fill="#5B21B6">where every pound went.</text>
    </g>
    <!-- EVALUATE -->
    <g transform="translate(544,0)">
      <rect width="256" height="292" rx="14" fill="#E3EBFC" stroke="#1D4ED8" stroke-opacity=".5"/>
      <rect x="18" y="18" width="42" height="42" rx="10" fill="#4F46E5"/>
      <g transform="translate(30,30)" class="gl"><circle cx="6" cy="9" r="6"/><path d="M3.5 9 l2 2 3.5 -4"/><circle cx="15" cy="6" r="4.4"/><path d="M13 4 l4 4 M17 4 l-4 4"/></g>
      <text x="72" y="34" class="cn" fill="#3730A3">Evaluate</text>
      <text x="72" y="50" class="ch" fill="#3730A3">CHALLENGE 3</text>
      <line x1="18" y1="72" x2="238" y2="72" stroke="#1D4ED8" stroke-opacity=".3"/>
      <text x="18" y="98" class="bd">Quality — Foundry portal eval</text>
      <text x="18" y="116" class="bd">of evidence-gap: 100%</text>
      <text x="18" y="134" class="bd">Coherence / Fluency.</text>
      <text x="18" y="164" class="bd">Correctness — a 20-case CI gate.</text>
      <text x="18" y="182" class="bd">Mandatory false-negatives, halluc-</text>
      <text x="18" y="200" class="bd">inated refs, unsafe automation:</text>
      <text x="18" y="218" class="bd">all hard-gated to zero.</text>
      <text x="18" y="260" class="em" fill="#3730A3">Route agreement 100% vs a</text>
      <text x="18" y="278" class="em" fill="#3730A3">single-prompt baseline's 55%.</text>
    </g>
    <!-- ORCHESTRATE -->
    <g transform="translate(816,0)">
      <rect width="256" height="292" rx="14" fill="#DBEFE6" stroke="#047857" stroke-opacity=".5"/>
      <rect x="18" y="18" width="42" height="42" rx="10" fill="#0E9E6E"/>
      <g transform="translate(30,31)" class="gl"><circle cx="9" cy="9" r="3"/><path d="M9 0 v3 M9 15 v3 M0 9 h3 M15 9 h3 M2.6 2.6 l2.1 2.1 M13.3 13.3 l2.1 2.1 M15.4 2.6 l-2.1 2.1 M4.7 13.3 l-2.1 2.1"/></g>
      <text x="72" y="34" class="cn" fill="#065F46">Orchestrate</text>
      <text x="72" y="50" class="ch" fill="#065F46">CHALLENGE 4</text>
      <line x1="18" y1="72" x2="238" y2="72" stroke="#047857" stroke-opacity=".3"/>
      <text x="18" y="98" class="bd">A Microsoft Agent Framework</text>
      <text x="18" y="116" class="bd">workflow graph — typed executors,</text>
      <text x="18" y="134" class="bd">the Gate as a plain node.</text>
      <text x="18" y="164" class="bd">Human review is a first-class</text>
      <text x="18" y="182" class="bd">RequestPort: pause → /respond</text>
      <text x="18" y="200" class="bd">→ resume, with Durable replay.</text>
      <text x="18" y="242" class="em" fill="#065F46">The reference orchestration</text>
      <text x="18" y="260" class="em" fill="#065F46">pattern for every agent project</text>
      <text x="18" y="278" class="em" fill="#065F46">the team builds after this one.</text>
    </g>
  </g>

  <line x1="40" y1="398" x2="1080" y2="398" stroke="#0FA3A0" stroke-opacity=".3"/>
  <text x="40" y="428" class="foot">Build → Monitor → Evaluate → Orchestrate</text>
  <text x="40" y="450" class="bd">Not four features bolted on — the spine of the whole course, each skill carried end to end into a system that runs.</text>
</svg>
