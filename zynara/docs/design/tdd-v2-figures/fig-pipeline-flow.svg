<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <style>
    text{ fill:#122A32; }
    .t{ font-size:21px; font-weight:800; }
    .sub{ font-size:12.5px; font-weight:600; fill:#44555C; }
    .n{ font-size:12px; font-weight:800; fill:#FFFFFF; }
    .nd{ font-size:11.5px; font-weight:800; }
    .sm{ font-size:10px; font-weight:600; fill:#2A3B42; }
    .rt{ font-size:10.5px; font-weight:800; }
    .foot{ font-size:12.5px; font-weight:700; fill:#0C7F76; }
    .gl{ fill:none; stroke:#FFFFFF; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5B6B72"/></marker>
  </defs>
  <rect width="1120" height="430" fill="#FFFFFF"/>
  <rect width="1120" height="5" fill="#0FA3A0"/>

  <text x="40" y="46" class="t">How a request becomes an approval</text>
  <text x="40" y="68" class="sub">Agents reason. Deterministic code decides. A person authorises. One adapter talks to the payer.</text>

  <!-- request -->
  <g transform="translate(40,92)">
    <rect width="120" height="86" rx="12" fill="#D7F0F0" stroke="#0D9488" stroke-opacity=".5"/>
    <text x="60" y="34" text-anchor="middle" class="nd" fill="#0C6157">Clinician</text>
    <text x="60" y="50" text-anchor="middle" class="nd" fill="#0C6157">request</text>
    <text x="60" y="68" text-anchor="middle" class="sm">note · plan ·</text>
    <text x="60" y="80" text-anchor="middle" class="sm">denial letter</text>
  </g>
  <path d="M164 135 H196" stroke="#5B6B72" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- build & challenge band -->
  <g transform="translate(200,84)">
    <rect width="470" height="102" rx="12" fill="#EDE4FC" stroke="#7C3AED" stroke-opacity=".5"/>
    <text x="14" y="20" class="rt" fill="#5B21B6">BUILD &amp; CHALLENGE · 5 agents — prose &amp; judgement only</text>
    <g font-size="10.5" font-weight="700" fill="#3B2A63">
      <rect x="14" y="30" width="84" height="26" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-opacity=".3"/><text x="56" y="47" text-anchor="middle">needs-auth</text>
      <rect x="104" y="30" width="94" height="26" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-opacity=".3"/><text x="151" y="47" text-anchor="middle">evidence-gap</text>
      <rect x="204" y="30" width="86" height="26" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-opacity=".3"/><text x="247" y="47" text-anchor="middle">claims</text>
      <rect x="296" y="30" width="94" height="26" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-opacity=".3"/><text x="343" y="47" text-anchor="middle">precedent</text>
      <rect x="14" y="64" width="58" height="26" rx="6" fill="#7C3AED"/><text x="43" y="81" text-anchor="middle" fill="#FFFFFF">critic</text>
      <text x="84" y="81" font-size="10.5" font-weight="600" fill="#3B2A63">tries to disprove the case before a human sees it</text>
    </g>
  </g>
  <path d="M674 135 H706" stroke="#5B6B72" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- gate -->
  <g transform="translate(710,92)">
    <rect width="120" height="86" rx="12" fill="#F4F7FF" stroke="#2563EB" stroke-opacity=".6" stroke-width="1.4"/>
    <text x="60" y="34" text-anchor="middle" class="nd" fill="#1D4ED8">Gate</text>
    <text x="60" y="52" text-anchor="middle" class="sm">deterministic</text>
    <text x="60" y="66" text-anchor="middle" class="sm">— never an</text>
    <text x="60" y="78" text-anchor="middle" class="sm">agent</text>
  </g>

  <!-- 4 routes — each just sets the headline the reviewer sees -->
  <g transform="translate(858,86)">
    <path d="M-28 49 H2" stroke="#5B6B72" stroke-width="1.6" marker-end="url(#a)"/>
    <g class="rt">
      <rect x="4" y="0" width="196" height="21" rx="10.5" fill="#DCFCE7"/><text x="102" y="14.5" text-anchor="middle" fill="#065F46">AutoSubmit — “ready, 1 click”</text>
      <rect x="4" y="26" width="196" height="21" rx="10.5" fill="#FEF3C7"/><text x="102" y="40.5" text-anchor="middle" fill="#92400E">Strengthen — “add evidence”</text>
      <rect x="4" y="52" width="196" height="21" rx="10.5" fill="#DBEAFE"/><text x="102" y="66.5" text-anchor="middle" fill="#1E40AF">HumanReview — “your judgement”</text>
      <rect x="4" y="78" width="196" height="21" rx="10.5" fill="#F3E8FF"/><text x="102" y="92.5" text-anchor="middle" fill="#6B21A8">Abstain — “not enough to advise”</text>
    </g>
  </g>

  <!-- second row: review + submit + payer -->
  <g transform="translate(40,236)">
    <rect width="150" height="76" rx="12" fill="#DBF1F4" stroke="#0891B2" stroke-opacity=".5"/>
    <text x="75" y="30" text-anchor="middle" class="nd" fill="#0E6F86">Reviewer ✓</text>
    <text x="75" y="48" text-anchor="middle" class="sm">human · approves</text>
    <text x="75" y="61" text-anchor="middle" class="sm">via a RequestPort</text>
  </g>
  <path d="M194 274 H236" stroke="#5B6B72" stroke-width="1.6" marker-end="url(#a)"/>
  <g transform="translate(240,236)">
    <rect width="170" height="76" rx="12" fill="#DBEFE6" stroke="#047857" stroke-opacity=".5"/>
    <text x="85" y="30" text-anchor="middle" class="nd" fill="#065F46">Submission Adapter</text>
    <text x="85" y="48" text-anchor="middle" class="sm">the ONLY path to a payer</text>
    <text x="85" y="61" text-anchor="middle" class="sm">portal · X12 278 · FHIR · fax</text>
  </g>
  <path d="M414 274 H456" stroke="#5B6B72" stroke-width="1.6" marker-end="url(#a)"/>
  <g transform="translate(460,236)">
    <rect width="120" height="76" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-opacity=".5"/>
    <text x="60" y="42" text-anchor="middle" class="nd" fill="#334155">Payer</text>
  </g>
  <!-- gate down to reviewer -->
  <path d="M770 178 V210 H115 V236" fill="none" stroke="#5B6B72" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="440" y="205" class="sm" fill="#5B6B72" font-weight="800">every route pauses here — no payer submission without an explicit human /respond</text>

  <line x1="40" y1="344" x2="1080" y2="344" stroke="#0FA3A0" stroke-opacity=".3"/>
  <text x="40" y="374" class="foot">The hybrid principle: agents write the prose, code owns every value that drives a decision or an action, a person authorises every send.</text>
  <text x="40" y="396" class="sm" font-size="12" fill="#22343B">Mandatory criteria are never averaged away. A contradiction is never silently resolved. When the evidence is too thin, the system abstains rather than guess.</text>
</svg>
