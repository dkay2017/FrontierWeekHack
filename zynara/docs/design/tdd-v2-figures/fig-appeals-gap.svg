<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <style>
    text{ fill:#122A32; }
    .t{ font-size:21px; font-weight:800; }
    .k{ font-size:44px; font-weight:800; }
    .kl{ font-size:11px; font-weight:700; fill:#3B4C53; letter-spacing:.02em; }
    .b{ font-size:12.5px; font-weight:600; fill:#22343B; }
    .cap{ font-size:12px; font-weight:700; fill:#FFFFFF; }
    .foot{ font-size:13px; font-weight:700; fill:#0C7F76; }
  </style>
  <rect width="1120" height="470" fill="#FFFFFF"/>
  <rect width="1120" height="5" fill="#0FA3A0"/>

  <text x="40" y="46" class="t">The gap Care Approval IQ closes</text>
  <text x="40" y="68" class="b" fill="#44555C">100 denied prior-authorisation requests — what happens next today</text>

  <!-- the 100-unit bar -->
  <g transform="translate(40,92)">
    <!-- won on appeal -->
    <rect x="0" y="0" width="93" height="58" fill="#1FBE6B"/>
    <!-- lost on appeal -->
    <rect x="93" y="0" width="22" height="58" fill="#BFE9D2"/>
    <!-- never appealed -->
    <rect x="115" y="0" width="925" height="58" fill="#E08A2B"/>
    <rect x="0" y="0" width="1040" height="58" fill="none" stroke="#122A32" stroke-opacity=".15"/>

    <text x="46" y="35" text-anchor="middle" class="cap">9 won</text>
    <text x="577" y="26" text-anchor="middle" class="cap" font-size="13">88 never appealed</text>
    <text x="577" y="44" text-anchor="middle" class="cap" font-size="11" fill="#FFF6EC">≈ 71 of them would have won</text>

    <!-- brace under appealed -->
    <path d="M0 66 V72 H115 V66" fill="none" stroke="#3B4C53" stroke-width="1.3"/>
    <text x="57" y="88" text-anchor="middle" class="kl">12 appealed</text>
  </g>

  <!-- stat callouts -->
  <g transform="translate(40,220)">
    <g>
      <text x="0" y="40" class="k" fill="#1FBE6B">80.7%</text>
      <text x="0" y="60" class="kl">of appeals win</text>
      <text x="0" y="76" class="b">95% for skilled-nursing</text>
    </g>
    <g transform="translate(300,0)">
      <text x="0" y="40" class="k" fill="#E08A2B">62%</text>
      <text x="0" y="60" class="kl">of physicians don't appeal</text>
      <text x="0" y="76" class="b">— because they believe they'll lose</text>
    </g>
    <g transform="translate(650,0)">
      <text x="0" y="40" class="k" fill="#1D4ED8">$687B</text>
      <text x="0" y="60" class="kl">US health admin / yr</text>
      <text x="0" y="76" class="b">vs $346B on direct patient care</text>
    </g>
  </g>

  <line x1="40" y1="340" x2="1080" y2="340" stroke="#0FA3A0" stroke-opacity=".3"/>
  <text x="40" y="372" class="foot">The winnable, un-appealed cases are money the payer keeps by default.</text>
  <text x="40" y="394" class="b">Care Approval IQ reads the payer's own denial history, finds the comparable wins, and drafts the appeal — with a person signing off every send.</text>

  <text x="40" y="440" class="b" fill="#6B7A80">Sources: AMA prior-auth survey · HHS OIG / KFF, 2026 · health-system administration cost studies.</text>
</svg>
