<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1056" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <title>Claria Health · Care Approval IQ — Architecture Design</title>
  <defs>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0FA3A0"/><stop offset="1" stop-color="#1FBE6B"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5C7C84"/>
    </marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/>
    </marker>
    <style>
      text{ fill:#12333B; }
      .muted{ fill:#5C7C84; } .tag{ fill:#0FA3A0; }
      .card{ fill:#FFFFFF; stroke:#E7E3D4; stroke-width:1; }
      .sect{ font-size:13px; font-weight:700; letter-spacing:.14em; }
      .flow{ fill:none; stroke:#5C7C84; stroke-width:1.6; }
      .flowd{ fill:none; stroke:#5C7C84; stroke-width:1.5; stroke-dasharray:5 4; }
      .apf{ fill:none; stroke:#6D28D9; stroke-width:1.5; }
      .lbl{ font-size:9px; } .paper{ fill:none; stroke:#FFFFFF; stroke-linecap:round; }
      .cn{ font-size:11px; font-weight:700; } .cs{ font-size:9.5px; }
    </style>
  </defs>

  <rect width="1280" height="1056" fill="#FDFCF3"/>

  <!-- ================= HEADER (logo + identity) ================= -->
  <g transform="translate(40,24)">
    <circle cx="34" cy="34" r="34" fill="url(#seal)"/>
    <circle cx="34" cy="34" r="28" fill="none" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="2" stroke-dasharray="1 4"/>
    <path class="paper" stroke-width="4" opacity=".45" d="M19 25 H49"/>
    <path class="paper" stroke-width="4" opacity=".62" d="M19 33 H43"/>
    <path class="paper" stroke-width="4" opacity=".8"  d="M19 41 H36"/>
    <path class="paper" stroke-width="5" stroke-linejoin="round" d="M23 39 L32 49 L51 24"/>
  </g>
  <text x="122" y="46" font-size="34" font-weight="800" letter-spacing="-.01em">claria</text>
  <text x="124" y="64" class="muted" font-size="11" font-weight="600" letter-spacing=".34em">H E A L T H</text>
  <text x="292" y="46" font-size="16" font-weight="600">Care Approval IQ</text>
  <text x="292" y="64" class="tag" font-size="14" font-weight="600" font-style="italic">Proof beats paperwork.</text>
  <text x="1240" y="34" text-anchor="end" class="muted" font-size="11" font-weight="700" letter-spacing=".2em">ARCHITECTURE DESIGN</text>
  <text x="1240" y="52" text-anchor="end" class="muted" font-size="11">Microsoft Agent-a-thon 2026 · Architect Track</text>
  <text x="1240" y="70" text-anchor="end" class="muted" font-size="11">Deepak Kumar · Original Work</text>
  <line x1="40" y1="104" x2="1240" y2="104" stroke="#E7E3D4"/>

  <!-- ================= AGENT DETAILS ================= -->
  <text x="40" y="134" class="sect">THE FIVE SPECIALISED AGENTS<tspan class="muted" font-weight="400" letter-spacing="0" font-size="12">   —   distinct kinds of reasoning, not distinct topics</tspan></text>

  <g font-size="10.5">
    <!-- 1 -->
    <g transform="translate(40,148)">
      <rect width="230" height="176" rx="14" class="card"/>
      <rect x="16" y="16" width="34" height="34" rx="10" fill="#6D28D9"/>
      <path d="M25 26 h16 a2 2 0 0 1 2 2 v10 a2 2 0 0 1 -2 2 h-16 a2 2 0 0 1 -2 -2 v-10 a2 2 0 0 1 2 -2 z M23 33 h20" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
      <text x="16" y="74" font-size="14" font-weight="700">Needs-Auth</text>
      <text x="16" y="96"  class="muted">Does this payer + plan require</text>
      <text x="16" y="110" class="muted">authorisation for this procedure</text>
      <text x="16" y="124" class="muted">today? Returns code + policy ref.</text>
      <line x1="16" y1="138" x2="214" y2="138" stroke="#EEE9DA"/>
      <text x="16" y="156" font-size="10"><tspan class="muted">reads  </tspan>payer rule-set KB,</text>
      <text x="16" y="169" font-size="10">procedure-code lookup</text>
    </g>
    <!-- 2 -->
    <g transform="translate(282.5,148)">
      <rect width="230" height="176" rx="14" class="card"/>
      <rect x="16" y="16" width="34" height="34" rx="10" fill="#6D28D9"/>
      <path d="M28 41 v-9 a5 5 0 0 1 10 0 v9 M24 41 h18 M33 24 v3" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
      <text x="16" y="74" font-size="14" font-weight="700">Evidence Gap</text>
      <text x="16" y="96"  class="muted">Reads the clinical note against</text>
      <text x="16" y="110" class="muted">the payer's written criteria —</text>
      <text x="16" y="124" class="muted">met / missing / contradictory.</text>
      <line x1="16" y1="138" x2="214" y2="138" stroke="#EEE9DA"/>
      <text x="16" y="156" font-size="10"><tspan class="muted">reads  </tspan>criteria (File Search</text>
      <text x="16" y="169" font-size="10">over data/policies), the note</text>
    </g>
    <!-- 3 -->
    <g transform="translate(525,148)">
      <rect width="230" height="176" rx="14" class="card"/>
      <rect x="16" y="16" width="34" height="34" rx="10" fill="#6D28D9"/>
      <path d="M33 25 a8 8 0 1 0 7 4 M33 25 v8 l6 4 M24 25 h4 v4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="16" y="74" font-size="14" font-weight="700">Precedent<tspan class="tag" font-size="10" font-weight="600">  ·  differentiator</tspan></text>
      <text x="16" y="96"  class="muted">Matches the case to recorded</text>
      <text x="16" y="110" class="muted">past outcomes; recommends &amp;</text>
      <text x="16" y="124" class="muted">drafts the appeal that wins.</text>
      <line x1="16" y1="138" x2="214" y2="138" stroke="#EEE9DA"/>
      <text x="16" y="156" font-size="10"><tspan class="muted">reads  </tspan>Submissions + Outcomes</text>
      <text x="16" y="169" font-size="10">store, the policy clause text</text>
    </g>
    <!-- 4 -->
    <g transform="translate(767.5,148)">
      <rect width="230" height="176" rx="14" class="card"/>
      <rect x="16" y="16" width="34" height="34" rx="10" fill="#6D28D9"/>
      <path d="M33 25 a8 8 0 1 1 -0.01 0 M33 28 v6 l4 3" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="16" y="74" font-size="14" font-weight="700">Expiry Watch<tspan class="muted" font-size="10" font-weight="600">  ·  continuous</tspan></text>
      <text x="16" y="96"  class="muted">Flags an approved auth that</text>
      <text x="16" y="110" class="muted">will lapse before the procedure</text>
      <text x="16" y="124" class="muted">is scheduled — a full redo.</text>
      <line x1="16" y1="138" x2="214" y2="138" stroke="#EEE9DA"/>
      <text x="16" y="156" font-size="10"><tspan class="muted">reads  </tspan>auth record + scheduling</text>
      <text x="16" y="169" font-size="10">feed  ·  deterministic date math</text>
    </g>
    <!-- 5 -->
    <g transform="translate(1010,148)">
      <rect width="230" height="176" rx="14" class="card"/>
      <rect x="16" y="16" width="34" height="34" rx="10" fill="#6D28D9"/>
      <path d="M24 25 h9 v16 h-9 z M39 29 h4 v16 h-9 v-4 M27 30 h3 M27 34 h3" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="16" y="74" font-size="14" font-weight="700">Policy Drift<tspan class="muted" font-size="10" font-weight="600">  ·  continuous</tspan></text>
      <text x="16" y="96"  class="muted">Flags request templates that a</text>
      <text x="16" y="110" class="muted">quiet criteria change has just</text>
      <text x="16" y="124" class="muted">broken — before submission.</text>
      <line x1="16" y1="138" x2="214" y2="138" stroke="#EEE9DA"/>
      <text x="16" y="156" font-size="10"><tspan class="muted">reads  </tspan>versioned payer policy</text>
      <text x="16" y="169" font-size="10">documents  ·  deterministic diff</text>
    </g>
  </g>
  <text x="40" y="344" class="muted" font-size="10.5">All five are persistent Foundry agents (gpt-4.1 class) behind <tspan fill="#12333B">Claria.Core</tspan> interfaces, each with a deterministic stub twin for offline tests.  Deterministic code owns every value that drives a decision; agents produce the prose.</text>

  <!-- ================= PIPELINE ARCHITECTURE ================= -->
  <text x="40" y="378" class="sect">PIPELINE ARCHITECTURE<tspan class="muted" font-weight="400" letter-spacing="0" font-size="12">   —   five layers along the request path, one human-approved outbound door</tspan></text>

  <!-- L1 · INTAKE (y392–496) -->
  <rect x="40" y="392" width="1200" height="104" rx="12" fill="#C2410C" fill-opacity=".07" stroke="#C2410C" stroke-opacity=".4"/>
  <text x="58" y="412" font-size="11" font-weight="700" fill="#C2410C" letter-spacing=".08em">1 · INTAKE</text>
  <rect x="66"  y="424" width="300" height="58" rx="9" class="card"/>
  <text x="82" y="446" class="cn">Clinician request</text>
  <text x="82" y="461" class="cs muted">procedure · coverage ref · clinical note</text>
  <text x="82" y="474" class="cs muted">· payer + plan · region</text>
  <rect x="470" y="424" width="284" height="58" rx="9" class="card"/>
  <text x="486" y="446" class="cn">Claria.Intake</text>
  <text x="486" y="461" class="cs muted">Azure Function · HTTP</text>
  <text x="486" y="474" class="cs muted">POST /api/requests</text>
  <rect x="858" y="424" width="300" height="58" rx="9" class="card"/>
  <text x="874" y="446" class="cn">Requests Queue</text>
  <text x="874" y="468" class="cs muted">Azure Storage Queue — decouples intake</text>
  <path class="flow" marker-end="url(#ah)" d="M366 453 H466"/>
  <path class="flow" marker-end="url(#ah)" d="M754 453 H854"/>

  <!-- L2 · COMPUTE · ORCHESTRATION (y504–608) -->
  <rect x="40" y="504" width="1200" height="104" rx="12" fill="#1D4ED8" fill-opacity=".07" stroke="#1D4ED8" stroke-opacity=".4"/>
  <text x="58" y="524" font-size="11" font-weight="700" fill="#1D4ED8" letter-spacing=".08em">2 · COMPUTE · ORCHESTRATION</text>
  <rect x="66" y="536" width="352" height="60" rx="9" class="card"/>
  <text x="82" y="558" class="cn">Claria.Orchestrator</text>
  <text x="82" y="573" class="cs muted">Durable Functions hub · keyed on</text>
  <text x="82" y="586" class="cs muted">request id (idempotent)</text>
  <text x="446" y="532" class="cs muted">deterministic spokes — no LLM</text>
  <g font-size="9" text-anchor="middle">
    <rect x="446"  y="538" width="135" height="58" rx="8" class="card"/><text x="513"  y="563">NeedsAuth</text><text x="513"  y="575">Check</text>
    <rect x="589"  y="538" width="135" height="58" rx="8" class="card"/><text x="656"  y="563">EvidenceGap</text><text x="656"  y="575">Match</text>
    <rect x="732"  y="538" width="135" height="58" rx="8" class="card"/><text x="799"  y="563">Precedent</text><text x="799"  y="575">Match</text>
    <rect x="875"  y="538" width="135" height="58" rx="8" class="card"/><text x="942"  y="570">ExpiryMath</text>
    <rect x="1018" y="538" width="136" height="58" rx="8" class="card"/><text x="1086" y="570">PolicyDiff</text>
  </g>
  <!-- Queue -> Orchestrator (routed through the L1/L2 gutter) -->
  <path class="flow" marker-end="url(#ah)" d="M1008 482 V500 H408 V536"/>
  <!-- Orchestrator -> first spoke -->
  <path class="flow" marker-end="url(#ah)" d="M418 566 H442"/>

  <!-- L3 · AI FOUNDRY · AGENT SERVICE (y616–720) -->
  <rect x="40" y="616" width="1200" height="104" rx="12" fill="#6D28D9" fill-opacity=".07" stroke="#6D28D9" stroke-opacity=".4"/>
  <text x="58" y="636" font-size="11" font-weight="700" fill="#6D28D9" letter-spacing=".08em">3 · AI FOUNDRY · AGENT SERVICE</text>
  <text x="140" y="668" class="muted lbl">orchestrator invokes each agent</text>
  <text x="140" y="681" class="muted lbl">— prose only, conditional</text>
  <text x="140" y="694" class="muted lbl">· File Search grounded</text>
  <g font-size="10" text-anchor="middle">
    <rect x="446"  y="648" width="135" height="58" rx="9" class="card"/><text x="513"  y="682">needs-auth</text>
    <rect x="589"  y="648" width="135" height="58" rx="9" class="card"/><text x="656"  y="682">evidence-gap</text>
    <rect x="732"  y="648" width="135" height="58" rx="9" class="card"/><text x="799"  y="682">precedent</text>
    <rect x="875"  y="648" width="135" height="58" rx="9" class="card"/><text x="942"  y="682">expiry-watch</text>
    <rect x="1018" y="648" width="136" height="58" rx="9" class="card"/><text x="1086" y="682">policy-drift</text>
    <text x="513" y="698" class="cs muted">agent</text><text x="656" y="698" class="cs muted">agent</text><text x="799" y="698" class="cs muted">agent</text>
    <text x="942" y="698" class="cs muted">agent</text><text x="1086" y="698" class="cs muted">agent</text>
  </g>
  <g class="apf" marker-end="url(#ahp)">
    <path d="M513 596 V644"/><path d="M656 596 V644"/><path d="M799 596 V644"/><path d="M942 596 V644"/><path d="M1086 596 V644"/>
  </g>

  <!-- L4 · DATA (y728–832) -->
  <rect x="40" y="728" width="1200" height="104" rx="12" fill="#15803D" fill-opacity=".07" stroke="#15803D" stroke-opacity=".4"/>
  <text x="58" y="748" font-size="11" font-weight="700" fill="#15803D" letter-spacing=".08em">4 · DATA</text>
  <path d="M168 760 L252 760 L296 786 L252 812 L168 812 L124 786 Z" fill="#FFFFFF" stroke="#15803D" stroke-opacity=".55" stroke-width="1.2"/>
  <text x="210" y="782" text-anchor="middle" class="cn">Gate</text>
  <text x="210" y="797" text-anchor="middle" class="cs muted">readiness ≥ θ ∧ no gaps</text>
  <rect x="374" y="758" width="330" height="56" rx="9" class="card"/>
  <text x="390" y="780" class="cn">Submission Adapter</text>
  <text x="390" y="795" class="cs muted">the ONLY outbound door —</text>
  <text x="390" y="807" class="cs muted">payer portal · X12 278 · FHIR · fax</text>
  <rect x="792" y="750" width="428" height="72" rx="9" class="card"/>
  <text x="808" y="770" class="cn">Azure SQL — serverless</text>
  <text x="808" y="785" class="cs muted">Requests · Submissions · Outcomes · Auths</text>
  <text x="808" y="798" class="cs muted">Policies · Precedents · EarlyWarnings · AgentCalls</text>
  <text x="808" y="813" class="muted" font-size="8.5">tests run against an in-memory SQLite double</text>
  <!-- Orchestrator -> Gate (after all spokes), down the left gutter -->
  <path class="flow" marker-end="url(#ah)" d="M66 592 H50 V786 H120"/>
  <text x="150" y="748" class="lbl muted">after all 5 spokes</text>
  <path class="flow" marker-end="url(#ah)" d="M296 786 H370"/>
  <text x="316" y="781" class="lbl muted">auto</text>
  <path class="flow" marker-end="url(#ah)" d="M704 786 H788"/>
  <!-- submit to payer (out) + appeal return -->
  <path class="flowd" marker-end="url(#ah)" d="M539 758 V742 H1214"/>
  <text x="1210" y="736" text-anchor="end" class="lbl muted">→ payer · submit / file appeal</text>
  <path class="flowd" marker-end="url(#ahp)" d="M1214 748 V726 H799 V708"/>
  <text x="1150" y="722" text-anchor="end" class="lbl muted">on denial → precedent-agent drafts the appeal</text>

  <!-- L5 · EXPERIENCE (y840–952) -->
  <rect x="40" y="840" width="1200" height="112" rx="12" fill="#0E7490" fill-opacity=".07" stroke="#0E7490" stroke-opacity=".4"/>
  <text x="58" y="860" font-size="11" font-weight="700" fill="#0E7490" letter-spacing=".08em">5 · EXPERIENCE</text>
  <rect x="66" y="876" width="256" height="56" rx="9" class="card"/>
  <text x="82" y="898" class="cn">Reviewer (human)</text>
  <text x="82" y="913" class="cs muted">approves / edits every</text>
  <text x="82" y="925" class="cs muted">submit &amp; every appeal</text>
  <rect x="392" y="866" width="500" height="76" rx="9" class="card"/>
  <text x="408" y="886" class="cn">Dashboard — Static Web App (Standard + linked backend)</text>
  <text x="408" y="902" class="cs muted">Queue · Appeals · Early Warnings · Recovery (£/$ left unclaimed)</text>
  <text x="408" y="915" class="cs muted">· Cost &amp; Governance</text>
  <rect x="408" y="922" width="156" height="14" rx="7" fill="#0E7490" fill-opacity=".15"/>
  <text x="486" y="932" text-anchor="middle" fill="#0E7490" font-size="9" font-weight="700">Region switch  UK ⇄ US</text>
  <rect x="960" y="876" width="260" height="56" rx="9" class="card"/>
  <text x="976" y="898" class="cn">Claria.ApiProxy</text>
  <text x="976" y="920" class="cs muted">read models + reviewer actions</text>
  <!-- Gate -> Reviewer -->
  <path class="flow" marker-end="url(#ah)" d="M210 812 V850 H292 V872"/>
  <text x="150" y="846" class="lbl muted">gap / low-confidence</text>
  <!-- Reviewer -> Adapter (approved) -->
  <path class="flow" marker-end="url(#ah)" d="M322 900 H352 V800 H372"/>
  <text x="332" y="794" class="lbl muted">approved</text>
  <!-- SQL -> ApiProxy -> Dashboard -->
  <path class="flow" marker-end="url(#ah)" d="M1090 822 V872"/>
  <path class="flow" marker-end="url(#ah)" d="M960 902 H896"/>

  <!-- ================= CROSS-CUTTING ================= -->
  <rect x="40" y="966" width="1200" height="40" rx="10" fill="#F3F0E3"/>
  <text x="58" y="982" font-size="10" font-weight="700" letter-spacing=".08em">CROSS-CUTTING</text>
  <g font-size="10" class="muted">
    <text x="58" y="997">Managed identity — SQL · Foundry · Storage</text>
    <text x="356" y="997">App Insights — one trace id per request id</text>
    <text x="648" y="997">Responsible AI — a human approves every outbound action</text>
    <text x="1030" y="997">Cost → AgentCalls → £/$</text>
  </g>
  <text x="1232" y="982" text-anchor="end" font-size="10" font-weight="700" fill="#0FA3A0">No PHI in scope</text>

  <!-- ================= LEGEND ================= -->
  <g transform="translate(40,1032)" font-size="10.5" class="muted">
    <circle cx="6"   cy="-4" r="5" fill="#C2410C"/><text x="18"  y="0">Intake</text>
    <circle cx="96"  cy="-4" r="5" fill="#1D4ED8"/><text x="108" y="0">Compute · Orchestration</text>
    <circle cx="300" cy="-4" r="5" fill="#6D28D9"/><text x="312" y="0">AI Foundry · Agents</text>
    <circle cx="470" cy="-4" r="5" fill="#15803D"/><text x="482" y="0">Data</text>
    <circle cx="540" cy="-4" r="5" fill="#0E7490"/><text x="552" y="0">Experience</text>
    <text x="1200" y="0" text-anchor="end" font-size="9.5">claria/docs/design/Care-Approval-IQ-Architecture_Design.svg</text>
  </g>
</svg>
