<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E7C7B"/>
      <stop offset="1" stop-color="#35C4B5"/>
    </linearGradient>
    <style>
      .ink   { fill: #0B3C49; }
      .sub   { fill: #5B7B84; letter-spacing: .34em; }
      .tag   { fill: #5B7B84; letter-spacing: .02em; }
      @media (prefers-color-scheme: dark) {
        .ink { fill: #EAF4F5; }
        .sub, .tag { fill: #9FBEC4; }
      }
    </style>
  </defs>

  <!-- ================= APP ICON ================= -->
  <g transform="translate(40,40)">
    <rect width="140" height="140" rx="34" fill="url(#mark)"/>
    <!-- long arm of the tick = three stacked strokes (layers of evidence) -->
    <g stroke="#FFFFFF" stroke-linecap="round" fill="none">
      <path d="M55 78 L118 34"  stroke-width="9" opacity=".45"/>
      <path d="M55 88 L118 44"  stroke-width="9" opacity=".7"/>
      <path d="M55 98 L118 54"  stroke-width="10"/>
    </g>
    <!-- short arm = the confirmed tick -->
    <path d="M31 82 L55 98" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ================= HORIZONTAL WORDMARK ================= -->
  <g transform="translate(210,95)">
    <text class="ink" font-size="72" font-weight="700">claria</text>
    <text class="sub" x="4" y="34" font-size="19" font-weight="600">H E A L T H</text>
  </g>

  <!-- ================= PRODUCT + TAGLINE LOCKUP ================= -->
  <g transform="translate(40,250)">
    <text class="ink" font-size="30" font-weight="600">Care Approval IQ</text>
    <text class="tag" y="42" font-size="20" font-style="italic">Proof beats paperwork.</text>
    <rect x="1" y="66" width="150" height="3" rx="1.5" fill="url(#mark)"/>
  </g>
</svg>
